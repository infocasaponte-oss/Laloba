name: Repository baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$bad" ]]; then
            echo "Environment files must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Inspect temporary source transfer
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.laloba-transfer/*.b64' > /dev/null; then
            echo "No temporary transfer payload present."
            exit 0
          fi

          count="$(find .laloba-transfer -maxdepth 1 -type f -name '*.b64' | wc -l)"
          bytes="$(cat .laloba-transfer/*.b64 | tr -d '\r\n' | wc -c)"
          echo "Transfer fragments: $count"
          echo "Encoded bytes: $bytes"

          # Validate each staged fragment as Base64 independently. The historical
          # upload did not persist a canonical manifest describing how multiple
          # upload batches should be concatenated, so CI must not guess ordering.
          while IFS= read -r part; do
            echo "Validating $part"
            tr -d '\r\n' < "$part" | base64 --decode > /dev/null
          done < <(find .laloba-transfer -maxdepth 1 -type f -name '*.b64' -print | sort)

          echo "Transfer fragments are syntactically valid Base64."
          echo "Full archive restoration requires a canonical fragment manifest."
