name: Repository baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          test -z "$bad" || { echo "Environment files must not be committed:"; echo "$bad"; exit 1; }
      - name: Validate transfer fragments
        shell: bash
        run: |
          set -euo pipefail
          for part in .laloba-transfer/*.b64; do
            [ -e "$part" ] || continue
            tr -d '\r\n' < "$part" | base64 --decode > /dev/null
          done

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect application lockfile
        id: app
        shell: bash
        run: |
          if [ -f package-lock.json ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck
      - name: Generator security suite
        if: steps.app.outputs.present == 'true'
        run: npm run test:generator

      - name: Test
        if: steps.app.outputs.present == 'true'
        run: npm test

      - name: Build development bundle
        if: steps.app.outputs.present == 'true'
        run: npm run build:dev
