name: Repository baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Verify canonical repository
        run: npm run check:runtime-source

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          test -z "$bad" || { echo "Environment files must not be committed:"; echo "$bad"; exit 1; }

      - name: Basic committed secret guard
        shell: bash
        run: |
          set -euo pipefail
          key_hits="$(git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- . ':!package-lock.json' || true)"
          token_hits="$(git grep -nE -- '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' -- . ':!package-lock.json' || true)"
          test -z "$key_hits$token_hits" || {
            echo "Potential committed secret material detected."
            [ -z "$key_hits" ] || echo "$key_hits"
            [ -z "$token_hits" ] || echo "$token_hits"
            exit 1
          }

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify canonical repository
        run: npm run check:runtime-source

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generator security suite
        run: npm run test:generator

      - name: Test
        run: npm test

      - name: Build development bundle
        run: npm run build:dev
