name: Repository baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$bad" ]]; then
            echo "Environment files must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Inspect temporary source transfer
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.laloba-transfer/*.b64' > /dev/null; then
            exit 0
          fi
          while IFS= read -r part; do
            tr -d '\r\n' < "$part" | base64 --decode > /dev/null
          done < <(find .laloba-transfer -maxdepth 1 -type f -name '*.b64' -print | sort)

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Typecheck
        if: hashFiles('package-lock.json') != ''
        run: npm run typecheck

      - name: Test
        if: hashFiles('package-lock.json') != ''
        run: npm test
