name: Repository baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          test -z "$bad" || { echo "Environment files must not be committed:"; echo "$bad"; exit 1; }

      - name: Verify normalized repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          test ! -e .laloba-transfer
          test ! -e .canonical-source
          test ! -e scripts/restore-source.sh
          test ! -e scripts/restore-canonical-lockfile.mjs

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical runtime source
        run: node scripts/check-runtime-source.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generator security suite
        run: npm run test:generator

      - name: Test
        run: npm test

      - name: Build development bundle
        run: npm run build:dev
