name: Bootstrap Laloba source

on:
  push:
    branches:
      - bootstrap-import
    paths:
      - ".bootstrap/ready"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 > /tmp/laloba.b64
          base64 --decode /tmp/laloba.b64 > /tmp/laloba-core.tar.gz
          echo "479d16df605dfc50fe52884f31d3f98b34cd966b69c05f82d35366565ed5d075  /tmp/laloba-core.tar.gz" | sha256sum --check -

      - name: Commit clean source tree to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          tar -xzf /tmp/laloba-core.tar.gz -C .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: import Laloba with security hardening"
          git push origin HEAD:main
